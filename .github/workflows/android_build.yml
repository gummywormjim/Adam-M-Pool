name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated Android APK build from HabitVault repository.'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ensure Android Platform Scaffolding
        run: |
          if [ ! -d "android" ]; then
            echo "Generating Android scaffolding with Flutter..."
            flutter create . --platforms=android --org=com.habitvault --project-name=habitvault
          fi

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          cp build/app/outputs/flutter-apk/app-release.apk release-output/HabitVault-v1.0.${{ github.run_number }}.apk
          cp build/app/outputs/flutter-apk/app-release.apk release-output/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitVault-Android-APK
          path: release-output/HabitVault-v1.0.${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "HabitVault Android APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 HabitVault Android Release (v1.0.${{ github.run_number }})

            ### ⬇️ Direct APK Download:
            Download and install the ready-to-use Android APK directly on your device:
            - **[HabitVault-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/HabitVault-v1.0.${{ github.run_number }}.apk)**
            - **[app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/app-release.apk)**

            ---

            ### ✨ Included Features & Updates:
            - **Unit Cost & Peak Spending Baseline**: Track exact per-pack/per-unit prices and true financial recovery.
            - **Compassionate Slip Tracking**: Choose *"It was just a slip, keep my sober date"* or *"Reset sober date to today"*.
            - **Mobile-Optimized Action Layout**: `+1 Unit` and `+Log` buttons aligned at the top of tracked items.
            - **First-Time Skippable Tutorial**: Cigarettes default with 0-day clean streak and guided spending walkthrough.
            - **100% Local Encrypted SQLite**: Complete device-level privacy with optional encrypted cloud backup.
          files: |
            release-output/HabitVault-v1.0.${{ github.run_number }}.apk
            release-output/app-release.apk
          draft: false
          prerelease: false

      - name: Add Download Links to Job Summary
        run: |
          echo "## 🎉 Android APK Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Android APK is compiled and ready for download:" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases Download**: [HabitVault-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/HabitVault-v1.0.${{ github.run_number }}.apk)" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases Overview**: [https://github.com/${{ github.repository }}/releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Artifact**: Available under the **Artifacts** section at the bottom of this run summary." >> $GITHUB_STEP_SUMMARY
