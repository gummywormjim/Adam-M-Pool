name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release Notes'
        required: false
        default: 'Automated Android APK build from HabitVault repository.'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Generate Android Platform
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.habitvault --project-name=habitvault
          # Inject required permissions and queries for 988 Crisis Hotline call/SMS into AndroidManifest.xml
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"\/>\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.DIAL" \/>\n            <data android:scheme="tel" \/>\n        <\/intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="sms" \/>\n        <\/intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" \/>\n            <data android:scheme="https" \/>\n        <\/intent>\n    <\/queries>' "$MANIFEST_FILE"
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare APK Release Artifact
        run: |
          mkdir -p release-output
          APK_FOUND=$(find build/ -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FOUND" ]; then
            APK_FOUND=$(find build/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FOUND"
          cp "$APK_FOUND" release-output/HabitVault-v1.0.${{ github.run_number }}.apk
          cp "$APK_FOUND" release-output/app-release.apk
          ls -la release-output

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitVault-Android-APK
          path: release-output/*.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}.${{ github.run_attempt }}"
          name: "HabitVault Android APK v1.0.${{ github.run_number }}"
          body: |
            ## 📱 HabitVault Android Release (v1.0.${{ github.run_number }})

            ### ⬇️ Direct APK Download:
            - **[HabitVault-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}.${{ github.run_attempt }}/HabitVault-v1.0.${{ github.run_number }}.apk)**
            - **[app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}.${{ github.run_attempt }}/app-release.apk)**

            ---
            ### ✨ Included Features & Fixes:
            - **🚨 24/7 Crisis Support Bar (988 Lifeline)**: Pinned at the very top with one-tap dialing and SMS messaging.
            - **💼 Monthly Income Impact Tracker**: Live calculation of % spent vs. retained freedom, annual burden, labor hours, and quick salary presets ($2.5k, $4k, $6k, $8k).
            - **🔐 Vault Passcode & Auto-Lock**: Lock anytime from the AppBar or Settings Drawer, and auto-locks on launch and app minimizing.
            - **Unit Cost & Peak Spending Baseline**: Per-unit and per-day exact financial tracking.
            - **Compassionate Slip Tracking**: Maintain sober streak or reset date with one touch.
            - **100% Local Encrypted Storage**: Zero tracking, complete offline privacy.
          files: release-output/*.apk
          draft: false
          prerelease: false

      - name: Add Download Links to Job Summary
        run: |
          echo "## 🎉 Android APK Successfully Built!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Android APK is compiled and ready for download:" >> $GITHUB_STEP_SUMMARY
          echo "- **GitHub Releases**: Check the Latest Release on [https://github.com/${{ github.repository }}/releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Artifacts**: Direct APK zip download under **Artifacts** at the bottom of this run summary." >> $GITHUB_STEP_SUMMARY
